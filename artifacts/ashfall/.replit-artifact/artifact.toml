kind = "web"
previewPath = "/ashfall/"
title = "Ashfall"
description = "A single-character survival RPG where you explore a living world, discover danger, gather resources, fight or escape, return to town, trade, equip, and venture out again."
version = "1.0.0"
id = "artifacts/ashfall"
router = "path"

[[services]]
name = "web"
paths = [ "/ashfall/" ]
localPort = 25722

[services.development]
run = "pnpm --filter @workspace/ashfall run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ashfall", "run", "build" ]
serve = "static"
publicDir = "artifacts/ashfall/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25722"
BASE_PATH = "/ashfall/"
