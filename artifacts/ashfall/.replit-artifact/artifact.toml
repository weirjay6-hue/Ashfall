kind = "web"
previewPath = "/"
title = "ASHFALL"
description = "A single-character open-world RPG browser game where the world continues to change around the player, with exploration, combat, dungeons, towns, quests, trading, and save/load."
version = "1.0.0"
id = "artifacts/ashfall"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25722

[services.development]
run = "pnpm --filter @workspace/ashfall run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ashfall", "run", "build" ]
serve = "static"
publicDir = "artifacts/ashfall/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25722"
BASE_PATH = "/"
